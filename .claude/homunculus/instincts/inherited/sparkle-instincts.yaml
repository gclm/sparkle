# Sparkle Workflow Service Lifecycle Or Auth Update

## Action

Follow the service-lifecycle-or-auth-update workflow:
1. Modify src/main/service/api.ts and/or src/main/service/auth-store.ts for service logic or auth changes
2. Update related service manager or key files (src/main/service/manager.ts, src/main/service/key.ts)
3. Adjust installer or platform scripts if needed (build/installer.nsh, build/linux/postinst, build/pkg-scripts/postinstall, etc.)
4. Update utility files for IPC or directory handling (src/main/utils/ipc.ts, src/main/utils/dirs.ts, src/main/utils/encrypt.ts)
5. Update renderer files if UI reflects service/auth state (src/renderer/src/components/mihomo/service-modal.tsx, etc.)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: src/main/service/api.ts, src/main/service/auth-store.ts, src/main/service/manager.ts

